name: Daily Systemic Risk Pipeline

on:
  schedule:
    - cron: '15 23 * * 1-5'  # 23:15 UTC Mon–Fri (after US close + 2h grace)
  workflow_dispatch:         # allow manual trigger at any time

concurrency:
  group: daily-risk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-pipeline:
    if: github.event_name == 'workflow_dispatch' || vars.RISK_PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FUNDAMENTALS_POLICY: yahoo_daily
      PUBLICATION_BASIS: market_metrics
      DATASET_KIND: research_estimate
      VENDOR_CACHE_DIR: inputs/vendor-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install '.[test]'

      - name: Test core before publication
        env:
          FUNDAMENTALS_POLICY: verified
          PUBLICATION_BASIS: srisk
        run: python -m pytest tests -q

      - name: Restore vendor observations
        uses: actions/cache@v4
        with:
          path: inputs/vendor-cache
          key: yahoo-daily-${{ runner.os }}-${{ github.run_id }}
          restore-keys: yahoo-daily-${{ runner.os }}-

      - name: Verify production inputs
        run: python -m src.production_preflight

      - name: Update available data
        id: update
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_BRANCH: ${{ github.ref_name }}
        run: python -m src.workflow_run

      - name: Preserve publication diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-diagnostics
          path: |
            data/last-attempt.json
            inputs/vendor-cache/
          if-no-files-found: ignore

      - name: Commit and push data
        if: steps.update.outputs.published == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "data: daily risk metrics $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push && exit 0
            echo "Push attempt $i failed, retrying in 5s…"
            sleep 5
          done
          echo "Failed to push after 3 attempts"
          exit 1
