name: Daily Systemic Risk Pipeline

on:
  schedule:
    - cron: '15 23 * * 1-5'  # 23:15 UTC Mon–Fri (after US close + 2h grace)
  workflow_dispatch:         # allow manual trigger at any time

concurrency:
  group: daily-risk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-pipeline:
    if: github.event_name == 'workflow_dispatch' || vars.RISK_PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install '.[test]'

      - name: Test core before publication
        run: python -m pytest tests -q

      - name: Verify production inputs
        run: python -m src.production_preflight

      - name: Run pipeline (today's date)
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_BRANCH: ${{ github.ref_name }}
        run: python -m src.pipeline --mode production

      - name: Preserve publication diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-diagnostics
          path: data/last-attempt.json
          if-no-files-found: ignore

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "data: daily risk metrics $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push && exit 0
            echo "Push attempt $i failed, retrying in 5s…"
            sleep 5
          done
          echo "Failed to push after 3 attempts"
          exit 1
