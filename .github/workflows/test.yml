name: Core regression checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install '.[test]'
      - run: python -m pytest tests loc/test_branch_locator.py -q
        env:
          RISK_QA_OUTPUT: /tmp/systemic-risk-qa-data
      - run: python -m build --wheel
      - run: npm ci && npm test && npm run typecheck && npm run build && npm run build:cloudflare && npx wrangler deploy --dry-run
        working-directory: frontend
