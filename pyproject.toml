[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gsib-systemic-risk"
version = "2.4.2"
description = "Daily systemic risk metrics (MES, CoVaR, SRISK) with audited G-SIB coverage"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["systemic-risk", "g-sibs", "srisk", "covar", "mes", "mcp", "finance"]
dependencies = [
    "exchange-calendars>=4.5,<5",
    "yfinance>=0.2.36",
    "akshare>=1.12.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "statsmodels>=0.14.0",
    "scipy>=1.11.0",
    "httpx>=0.27.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "mcp>=1.8.0,<2",
    "python-dateutil>=2.9.0",
    "pyarrow>=15.0.0",
]

[project.scripts]
gsib-normalize-chart = "src.yahoo_inputs:main"
gsib-readiness = "src.readiness:main"
gsib-sec-inputs = "src.sec_inputs:main"
gsib-pipeline = "src.pipeline:main"
gsib-mcp = "risk_mcp.server:main"
gsib-branch-cache = "loc.branch_locator:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "risk_mcp*", "loc*"]


[project.optional-dependencies]
test = ["pytest>=8", "build>=1"]
